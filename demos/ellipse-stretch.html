<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Which Way Does the Ellipse Stretch? · Interactive Demos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: graph on the left, equation + controls on the right; stacks on phones. */
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --fg: #1d2330;
  --muted: #5d6677;
  --grid: #e3e7ee;
  --axis: #8c95a6;
  --line: #d8dde6;
  --x: #1f6fd1;      /* horizontal: x² denominator */
  --y: #c2410c;      /* vertical: y² denominator */
  --curve: #1d2330;
  --focus: #6b4fd8;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1a1e26; --fg: #e8ebf1; --muted: #9aa3b4;
    --grid: #232833; --axis: #5d6677; --line: #2c323e;
    --x: #6aa8f5; --y: #f39159; --curve: #e8ebf1; --focus: #a993ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1e26; --fg: #e8ebf1; --muted: #9aa3b4;
  --grid: #232833; --axis: #5d6677; --line: #2c323e;
  --x: #6aa8f5; --y: #f39159; --curve: #e8ebf1; --focus: #a993ff;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
.wrap {
  max-width: 1100px; margin: 0 auto;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
header h1 {
  font-family: var(--font-display); font-weight: 600; font-size: 1.9rem;
  margin: 0; text-wrap: balance; letter-spacing: -0.01em;
}
header p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); } }
.graph {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  aspect-ratio: 1 / 1; max-width: 100%; position: relative; overflow: hidden;
}
canvas { display: block; width: 100%; height: 100%; }
.side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.eq {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 22px 16px; display: flex; justify-content: center; align-items: center;
  font-family: var(--font-display); font-size: clamp(1.6rem, 4.2vw, 2.4rem);
  gap: 0.35em; flex-wrap: nowrap; overflow-x: auto;
}
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac .num { padding: 0 0.2em; font-style: italic; }
.frac .den {
  border-top: 2px solid currentColor; padding: 0.05em 0.25em 0;
  font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: center;
  border-radius: 4px; transition: background-color .2s, color .2s;
}
.frac.x .den { color: var(--x); }
.frac.y .den { color: var(--y); }
.frac .den.big { background: color-mix(in srgb, currentColor 14%, transparent); font-weight: 600; }
sup { font-size: 0.55em; }
.verdict {
  font-size: 1.05rem; padding: 12px 14px; border-radius: 8px;
  background: var(--panel); border: 1px solid var(--line);
  border-left: 4px solid var(--verdict, var(--axis));
}
.verdict b { color: var(--verdict, var(--fg)); }
.controls { display: flex; flex-direction: column; gap: 14px; }
.ctl label { display: flex; justify-content: space-between; font-weight: 500; font-size: 0.92rem; }
.ctl label span.v { font-family: var(--font-mono); color: var(--muted); }
input[type=range] { width: 100%; margin: 6px 0 0; }
#sx { accent-color: var(--x); }
#sy { accent-color: var(--y); }
.buttons { display: flex; gap: 10px; flex-wrap: wrap; }
button {
  font: inherit; font-weight: 500; padding: 8px 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer;
}
button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.toggles { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.9rem; color: var(--muted); }
.toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.facts {
  font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted);
  display: grid; grid-template-columns: auto 1fr; gap: 2px 14px;
}
.facts dt { color: var(--fg); }
.crumbs{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}
.crumbs a{color:#006648;text-decoration:none;font-weight:600}
:root[data-theme="dark"] .crumbs a{color:#5cc49a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .crumbs a{color:#5cc49a}}
.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
</style>

<div class="wrap">
  <header>
    <p class="crumbs"><a href="https://rpennell-math.github.io/">&larr; Home</a> · <a href="./">Interactive Demos</a></p>
    <h1>Which way does the ellipse stretch?</h1>
    <p>The bigger denominator wins. Whichever variable sits over the larger number is the direction the ellipse stretches. Move the sliders or press Animate and watch.</p>
  </header>

  <div class="main">
    <div class="graph"><canvas id="c" aria-label="Graph of the ellipse"></canvas></div>

    <div class="side">
      <div class="eq" aria-live="polite">
        <span class="frac x"><span class="num">x<sup>2</sup></span><span class="den" id="dx">9</span></span>
        <span>+</span>
        <span class="frac y"><span class="num">y<sup>2</sup></span><span class="den" id="dy">4</span></span>
        <span>=</span><span>1</span>
      </div>

      <div class="verdict" id="verdict"></div>

      <div class="controls">
        <div class="ctl">
          <label for="sx">Denominator under x² <span class="v" id="lx"></span></label>
          <input type="range" id="sx" min="1" max="25" step="1" value="9">
        </div>
        <div class="ctl">
          <label for="sy">Denominator under y² <span class="v" id="ly"></span></label>
          <input type="range" id="sy" min="1" max="25" step="1" value="4">
        </div>
        <div class="buttons">
          <button class="primary" id="play">Animate</button>
          <button id="swap">Swap denominators</button>
        </div>
        <div class="toggles">
          <label><input type="checkbox" id="showAxes" checked> Show half-axes</label>
          <label><input type="checkbox" id="showFoci"> Show foci</label>
        </div>
      </div>

      <dl class="facts" id="facts"></dl>
    </div>
  </div>
</div>

<script>
(() => {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const sx = document.getElementById('sx'), sy = document.getElementById('sy');
  const dx = document.getElementById('dx'), dy = document.getElementById('dy');
  const lx = document.getElementById('lx'), ly = document.getElementById('ly');
  const verdict = document.getElementById('verdict');
  const facts = document.getElementById('facts');
  const play = document.getElementById('play');
  const showAxes = document.getElementById('showAxes');
  const showFoci = document.getElementById('showFoci');
  const RANGE = 5.5;
  let A = 9, B = 4, playing = false, t = 0, last = 0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fmt = v => Math.abs(v - Math.round(v)) < 1e-6 ? String(Math.round(v)) : v.toFixed(1);
  const sq = v => {
    const r = Math.sqrt(v);
    return Math.abs(r - Math.round(r)) < 1e-6 ? String(Math.round(r)) : '√' + fmt(v) + ' ≈ ' + r.toFixed(2);
  };

  function size() {
    const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    c.width = Math.round(r.width * d); c.height = Math.round(r.height * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    draw();
  }

  function draw() {
    const W = c.clientWidth, H = c.clientHeight;
    const s = Math.min(W, H) / (2 * RANGE), cx = W / 2, cy = H / 2;
    const X = x => cx + x * s, Y = y => cy - y * s;
    const col = { grid: css('--grid'), axis: css('--axis'), x: css('--x'), y: css('--y'),
                  curve: css('--curve'), focus: css('--focus'), muted: css('--muted'), panel: css('--panel') };
    ctx.clearRect(0, 0, W, H);

    ctx.lineWidth = 1; ctx.strokeStyle = col.grid;
    for (let i = -5; i <= 5; i++) {
      ctx.beginPath(); ctx.moveTo(X(i), Y(-RANGE)); ctx.lineTo(X(i), Y(RANGE)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(-RANGE), Y(i)); ctx.lineTo(X(RANGE), Y(i)); ctx.stroke();
    }
    ctx.strokeStyle = col.axis; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(X(-RANGE), cy); ctx.lineTo(X(RANGE), cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, Y(-RANGE)); ctx.lineTo(cx, Y(RANGE)); ctx.stroke();
    ctx.fillStyle = col.muted; ctx.font = '12px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (let i = -5; i <= 5; i++) if (i) ctx.fillText(i, X(i), cy + 4);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let i = -5; i <= 5; i++) if (i) ctx.fillText(i, cx - 6, Y(i));

    const a = Math.sqrt(A), b = Math.sqrt(B);

    if (showAxes.checked) {
      ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.strokeStyle = col.x; ctx.beginPath(); ctx.moveTo(X(-a), cy); ctx.lineTo(X(a), cy); ctx.stroke();
      ctx.strokeStyle = col.y; ctx.beginPath(); ctx.moveTo(cx, Y(-b)); ctx.lineTo(cx, Y(b)); ctx.stroke();
    }

    ctx.lineWidth = 3; ctx.strokeStyle = col.curve;
    ctx.beginPath(); ctx.ellipse(cx, cy, a * s, b * s, 0, 0, Math.PI * 2); ctx.stroke();

    const dot = (x, y, color, label, dxl, dyl, align) => {
      ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), 5, 0, Math.PI * 2); ctx.fill();
      if (!label) return;
      ctx.font = '600 13px "IBM Plex Mono", monospace';
      ctx.textAlign = align; ctx.textBaseline = 'middle';
      ctx.fillText(label, X(x) + dxl, Y(y) + dyl);
    };
    const ax = fmt(a * 1 === Math.round(a) ? a : a), axl = Number.isInteger(a) ? a : a.toFixed(2);
    const byl = Number.isInteger(b) ? b : b.toFixed(2);
    dot(a, 0, col.x, '(' + axl + ', 0)', 6, -14, 'left');
    dot(-a, 0, col.x, '', 0, 0);
    dot(0, b, col.y, '(0, ' + byl + ')', 8, -12, 'left');
    dot(0, -b, col.y, '', 0, 0);

    if (showFoci.checked && Math.abs(A - B) > 1e-6) {
      const cF = Math.sqrt(Math.abs(A - B));
      const pts = A > B ? [[cF, 0], [-cF, 0]] : [[0, cF], [0, -cF]];
      for (const [x, y] of pts) {
        ctx.strokeStyle = col.focus; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(X(x), Y(y), 6, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = col.focus; ctx.font = '600 12px "IBM Plex Sans", sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      const [fx, fy] = pts[1];
      ctx.fillText('focus', X(fx) + 10, Y(fy) + (A > B ? 14 : 0));
    }
  }

  function update(fromSlider) {
    if (fromSlider) { A = +sx.value; B = +sy.value; }
    dx.textContent = fmt(A); dy.textContent = fmt(B);
    lx.textContent = fmt(A); ly.textContent = fmt(B);
    const eps = 0.05;
    dx.classList.toggle('big', A > B + eps);
    dy.classList.toggle('big', B > A + eps);
    if (Math.abs(A - B) <= eps) {
      verdict.style.setProperty('--verdict', css('--focus'));
      verdict.innerHTML = '<b>Equal denominators:</b> no stretch either way. It is a circle of radius ' + sq(A) + '.';
    } else if (A > B) {
      verdict.style.setProperty('--verdict', css('--x'));
      verdict.innerHTML = '<b>' + fmt(A) + ' &gt; ' + fmt(B) + '</b>, the bigger number is under <i>x</i>², so the ellipse stretches <b>horizontally</b>.';
    } else {
      verdict.style.setProperty('--verdict', css('--y'));
      verdict.innerHTML = '<b>' + fmt(B) + ' &gt; ' + fmt(A) + '</b>, the bigger number is under <i>y</i>², so the ellipse stretches <b>vertically</b>.';
    }
    const horiz = A >= B, big = Math.max(A, B), small = Math.min(A, B);
    facts.innerHTML =
      '<dt>Major axis</dt><dd>' + (Math.abs(A - B) <= eps ? '—' : (horiz ? 'horizontal (along x)' : 'vertical (along y)')) + '</dd>' +
      '<dt>a² = ' + fmt(big) + '</dt><dd>a = ' + sq(big) + '</dd>' +
      '<dt>b² = ' + fmt(small) + '</dt><dd>b = ' + sq(small) + '</dd>' +
      '<dt>c² = a² − b²</dt><dd>c² = ' + fmt(big - small) + '</dd>';
    draw();
  }

  function frame(now) {
    if (!playing) return;
    const dt = last ? (now - last) / 1000 : 0; last = now;
    t += dt * 0.6;
    A = 13 + 9 * Math.cos(t); B = 13 - 9 * Math.cos(t);
    sx.value = Math.round(A); sy.value = Math.round(B);
    update(false);
    requestAnimationFrame(frame);
  }
  function stop() { playing = false; play.textContent = 'Animate'; }

  play.addEventListener('click', () => {
    if (playing) { stop(); A = +sx.value; B = +sy.value; update(false); return; }
    playing = true; play.textContent = 'Pause'; last = 0;
    t = Math.acos(Math.max(-1, Math.min(1, (A - B) / 18)));
    if (reduce) { stop(); A = B = 0; [A, B] = [+sy.value, +sx.value]; sx.value = A; sy.value = B; update(false); return; }
    requestAnimationFrame(frame);
  });
  document.getElementById('swap').addEventListener('click', () => {
    stop(); const a = sx.value; sx.value = sy.value; sy.value = a; update(true);
  });
  sx.addEventListener('input', () => { stop(); update(true); });
  sy.addEventListener('input', () => { stop(); update(true); });
  showAxes.addEventListener('change', draw);
  showFoci.addEventListener('change', draw);
  new ResizeObserver(size).observe(c);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => update(false));
  new MutationObserver(() => update(false)).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.fonts) document.fonts.ready.then(draw);
  update(true); size();
})();
</script>

</body></html>
